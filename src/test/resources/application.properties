spring.security.user.name=admin
spring.security.user.password=password

risk.rule.evaluator.decline.threshold=70
risk.rule.evaluator.review.threshold=40
risk.rule.evaluator.timeout.value=3

amount.rule.high.risk.amount=1000
amount.rule.medium.risk.amount=500
amount.rule.high.risk.value=10
amount.rule.medium.risk.value=5

