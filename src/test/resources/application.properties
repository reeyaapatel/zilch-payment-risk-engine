spring.security.user.name=admin
spring.security.user.password=password

payment.risk.decline.threshold=70
payment.risk.review.threshold=40
payment.risk.review.timeout=3

amount.high.risk.amount=1000
amount.medium.risk.amount=500
amount.high.risk.score=10
amount.medium.risk.score=5

credit.high.risk.score.threshold=500
credit.medium.risk.score.threshold=650
credit.high.risk.value=50
credit.medium.risk.value=20

credit.score.cache.maximum-size=10000
credit.score.cache.expire-after-write-minutes=1000

risk.rule.executor.core.pool.size=4
risk.rule.executor.max.pool.size=8
risk.rule.executor.queue.capacity=50

ip.geo.location.api.endpoint=http://localhost/ip-api/
ip.geo.location.api.connect.timeout=1s
ip.geo.location.api.read.timeout=2s
