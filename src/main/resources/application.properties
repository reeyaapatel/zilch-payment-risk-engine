#dev application properties

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:file:./data/riskdb
spring.datasource.driverClassName=org.h2.Driver
#username and password would not be stored here - just for demo
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

#debugging
logging.level.org.flywaydb=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#username and password would not be stored here - just for demo
spring.security.user.name=admin
spring.security.user.password=password


#application values - improvements would be having external property config
payment.risk.decline.threshold=70
payment.risk.review.threshold=40
payment.risk.review.timeout=3

amount.high.risk.amount=1000
amount.medium.risk.amount=500
amount.high.risk.score=10
amount.medium.risk.score=5

low.credit.score.risk.threshold=500
medium.credit.score.risk.threshold=650
low.credit.risk.value=50
medium.credit.risk.value=20

credit.score.cache.maximum-size=10000
credit.score.cache.expire-after-write-minutes=1000

risk.rule.executor.core.pool.size=4
risk.rule.executor.max.pool.size=8
risk.rule.executor.queue.capacity=50

ip.geo.location.api.endpoint=http://ip-api.com/json/
